name: Frontend CI/CD

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
    paths:
      - ".github/workflows/frontend-ci-cd.yml"
      - "apps/**"
      - "functions/**"
      - "shared/**"
      - "tests/api-*.test.mjs"
      - "tests/backend-ci-*.test.mjs"
      - "tests/frontend-api-routing.test.mjs"
      - "tests/portal-response-adapters.test.mjs"
      - "docs/api_contract.md"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - "package.json"
      - "scripts/frontend-cicd/**"
  push:
    branches:
      - dev
      - staging
      - main
    paths:
      - ".github/workflows/frontend-ci-cd.yml"
      - "apps/**"
      - "functions/**"
      - "shared/**"
      - "tests/api-*.test.mjs"
      - "tests/backend-ci-*.test.mjs"
      - "tests/frontend-api-routing.test.mjs"
      - "tests/portal-response-adapters.test.mjs"
      - "docs/api_contract.md"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - "package.json"
      - "scripts/frontend-cicd/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend Validate
    runs-on: ubuntu-latest
    env:
      PARABOLIC_BUILD_ENVIRONMENT: "test"
      FIREBASE_PROJECT_ID: "demo-parabolic-test"
      VITE_FIREBASE_API_KEY: "demo-api-key"
      VITE_FIREBASE_AUTH_DOMAIN: "demo-parabolic-test.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "demo-parabolic-test"
      VITE_FIREBASE_APP_ID: "1:000000000000:web:ci"
      VITE_FIREBASE_AUTH_EMULATOR_URL: ""
      VITE_FIREBASE_STORAGE_BUCKET: "demo-parabolic-test.firebasestorage.app"
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_MEASUREMENT_ID: ""
      VITE_API_BASE_URL: ""
      VITE_CDN_BASE_URL: "https://cdn.test.invalid"
      VITE_PORTAL_BASE_URL: "https://portal.test.invalid"
      VITE_EXAM_BASE_URL: "https://exam.test.invalid"
      VITE_VENDOR_BASE_URL: "https://vendor.test.invalid"
      VITE_DATA_MODE: "live"
      VITE_EXAM_DEV_MOCK_ENTRY: "false"
      VITE_RELEASE_ID: "gha-${{ github.run_id }}-${{ github.run_attempt }}"
      VITE_RELEASE_COMMIT_SHA: "${{ github.sha }}"
      PROJECT_ID: "demo-parabolic-test"
      NODE_ENV: "test"
      APP_BASE_URL: "https://portal.test.invalid"
      EXAM_BASE_URL: "https://exam.test.invalid"
      VENDOR_BASE_URL: "https://vendor.test.invalid"
      CDN_BASE_URL: "https://cdn.test.invalid"
      QUESTION_ASSETS_BUCKET: "demo-parabolic-test-question-assets"
      REPORTS_BUCKET: "demo-parabolic-test-reports"
      RELEASE_ID: "gha-${{ github.run_id }}-${{ github.run_attempt }}"
      RELEASE_COMMIT_SHA: "${{ github.sha }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/student/package-lock.json
            apps/exam/package-lock.json
            apps/vendor/package-lock.json
            shared/package-lock.json
            functions/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          for app in admin student exam vendor; do
            npm ci --prefix "apps/${app}"
          done
          npm ci --prefix shared
          npm ci --prefix functions

      - name: Inject release build timestamp
        shell: bash
        run: |
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "VITE_RELEASE_BUILT_AT=${built_at}" >> "${GITHUB_ENV}"
          echo "RELEASE_BUILT_AT=${built_at}" >> "${GITHUB_ENV}"

      - name: Validate build environment
        run: node scripts/frontend-cicd/validate-build-environment.mjs --validate

      - name: Lint frontend portals
        shell: bash
        run: |
          set -euo pipefail
          for app in admin student exam vendor; do
            npm --prefix "apps/${app}" run lint
          done

      - name: Type check and build frontend portals
        shell: bash
        run: |
          set -euo pipefail
          VITE_BASE_PATH=/admin/ npm --prefix apps/admin run build
          VITE_BASE_PATH=/student/ npm --prefix apps/student run build
          npm --prefix apps/exam run build
          npm --prefix apps/vendor run build
          npm --prefix functions run build

      - name: Scan release artifacts
        run: node scripts/frontend-cicd/scan-release-artifacts.mjs --scan

      - name: Run frontend automated tests
        shell: bash
        run: |
          set -euo pipefail
          for app in admin student exam vendor; do
            npm --prefix "apps/${app}" run test --if-present
          done

  backend-ci:
    name: Backend Validate
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NODE_ENV: "test"
      PROJECT_ID: "demo-parabolic-test"
      GCLOUD_PROJECT: "demo-parabolic-test"
      GOOGLE_CLOUD_PROJECT: "demo-parabolic-test"
      NO_GCE_CHECK: "true"
      METADATA_SERVER_DETECTION: "none"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install backend test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix functions

      - name: Install Chromium and pinned Firebase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm run playwright:install
          npm install --global firebase-tools@15.9.0
          firebase --version

      - name: Lint Functions
        run: npm --prefix functions run lint

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Run deterministic non-emulator tests
        run: npm --prefix functions run test:ci:non-emulator

      - name: Run accumulated emulator integration tests
        shell: bash
        run: |
          set -euo pipefail
          npm run test:emulators:ci
          npm run test:emulators:failure-cleanup

      - name: Validate backend CI contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:backend-ci-trigger-coverage
          npm run test:backend-ci-validation
          npm run test:emulator-harness-contract
          npm run test:emulator-aggregate-contract

  frontend-deploy:
    name: Frontend Deploy
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'staging' || github.ref_name == 'main')
    concurrency:
      group: frontend-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}
    env:
      PARABOLIC_DEPLOY_BRANCH: ${{ github.ref_name }}
      PARABOLIC_BUILD_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_SITE_PORTAL: ${{ vars.FIREBASE_SITE_PORTAL }}
      FIREBASE_SITE_EXAM: ${{ vars.FIREBASE_SITE_EXAM }}
      FIREBASE_SITE_VENDOR: ${{ vars.FIREBASE_SITE_VENDOR }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_AUTH_EMULATOR_URL: ""
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_API_BASE_URL: ""
      VITE_CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
      VITE_PORTAL_BASE_URL: ${{ vars.VITE_PORTAL_BASE_URL }}
      VITE_EXAM_BASE_URL: ${{ vars.VITE_EXAM_BASE_URL }}
      VITE_VENDOR_BASE_URL: ${{ vars.VITE_VENDOR_BASE_URL }}
      VITE_DATA_MODE: "live"
      VITE_EXAM_DEV_MOCK_ENTRY: "false"
      VITE_RELEASE_ID: "gha-${{ github.run_id }}-${{ github.run_attempt }}"
      VITE_RELEASE_COMMIT_SHA: "${{ github.sha }}"
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      NODE_ENV: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}
      APP_BASE_URL: ${{ vars.VITE_PORTAL_BASE_URL }}
      EXAM_BASE_URL: ${{ vars.VITE_EXAM_BASE_URL }}
      VENDOR_BASE_URL: ${{ vars.VITE_VENDOR_BASE_URL }}
      CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
      QUESTION_ASSETS_BUCKET: ${{ vars.QUESTION_ASSETS_BUCKET }}
      REPORTS_BUCKET: ${{ vars.REPORTS_BUCKET }}
      RELEASE_ID: "gha-${{ github.run_id }}-${{ github.run_attempt }}"
      RELEASE_COMMIT_SHA: "${{ github.sha }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/student/package-lock.json
            apps/exam/package-lock.json
            apps/vendor/package-lock.json
            shared/package-lock.json
            functions/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          for app in admin student exam vendor; do
            npm ci --prefix "apps/${app}"
          done
          npm ci --prefix shared
          npm ci --prefix functions

      - name: Inject release build timestamp
        shell: bash
        run: |
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "VITE_RELEASE_BUILT_AT=${built_at}" >> "${GITHUB_ENV}"
          echo "RELEASE_BUILT_AT=${built_at}" >> "${GITHUB_ENV}"

      - name: Validate build environment
        run: node scripts/frontend-cicd/validate-build-environment.mjs --validate

      - name: Validate deploy target mapping
        run: node scripts/frontend-cicd/validate-deploy-target.mjs --validate

      - name: Build deployment artifacts
        shell: bash
        run: |
          set -euo pipefail
          VITE_BASE_PATH=/admin/ npm --prefix apps/admin run build
          VITE_BASE_PATH=/student/ npm --prefix apps/student run build
          npm --prefix apps/exam run build
          npm --prefix apps/vendor run build
          npm --prefix functions run build
          node scripts/frontend-cicd/prepare-portal-hosting.mjs

      - name: Scan release artifacts
        run: >-
          node scripts/frontend-cicd/scan-release-artifacts.mjs --scan
          --root .firebase/hosting/portal
          --root apps/exam/dist
          --root apps/vendor/dist

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Validate deploy credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_TOKEN}"

      - name: Apply hosting targets
        shell: bash
        run: |
          set -euo pipefail
          firebase target:apply hosting portal "${FIREBASE_SITE_PORTAL}" --project "${FIREBASE_PROJECT_ID}" --token "${FIREBASE_TOKEN}"
          firebase target:apply hosting exam "${FIREBASE_SITE_EXAM}" --project "${FIREBASE_PROJECT_ID}" --token "${FIREBASE_TOKEN}"
          firebase target:apply hosting vendor "${FIREBASE_SITE_VENDOR}" --project "${FIREBASE_PROJECT_ID}" --token "${FIREBASE_TOKEN}"

      - name: Deploy hosting bundles
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --project "${FIREBASE_PROJECT_ID}" --only hosting:portal,hosting:exam,hosting:vendor --non-interactive --token "${FIREBASE_TOKEN}"
